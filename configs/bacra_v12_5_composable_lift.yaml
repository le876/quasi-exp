composable_lift:
  strategy_id: strict_gold_edge_plus_linear_fiber_retraction_v1
  beta_step_deg: 0.05
  endpoint_match_max_deg: 0.5
  residual_max_mm: 3.0
  gold_margin_deg: 1.5
  require_all_selected_saved_edges: true
  factorize_fresh_audit_edges: true
  independent_repeat_replicates: 2

dense:
  # V12.5's dataset domain is the admitted canonical chart, not task nodes
  # explicitly excluded by the composability restriction.
  include_canonical_anchors: true
  coverage_reference: admitted_canonical_chart
  max_tetrahedron_edge_mm: 12.99038105676658
  target_support_max_mm: 7.5
  canonical_barycentric_retraction: true
  # Rejection rate is computational evidence.  Label validity, complete row
  # materialization, fill distance, consistency and conflicts remain hard.
  acceptance_ratio_is_gate: false

student:
  use_full_d3_dataset: true

parallel:
  audit_workers: 12
  dense_workers: 12
  default_workers: 12

smoke:
  output_root: runs/branch_aware_canonical_region_atlas_v12_5_composable_lift_smoke
  candidates:
    # V12.4 source edges were admitted with the pilot Teacher setting.  The
    # composability smoke may shrink path inventory, but must not change the
    # corrector used to reproduce those frozen edges.
    max_corrector_iterations: 100
  audit:
    endpoint_count: 20
    formal_endpoint_count: 20
    paths_per_endpoint: 2
    formal_paths_per_endpoint: 2
    loop_count: 20
    formal_loop_count: 20

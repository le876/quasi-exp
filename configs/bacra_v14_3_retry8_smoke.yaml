  hidden_units: [128, 128, 64]
  rescue_hidden_units: [256, 128, 64]
  router_hidden_units: [128, 64]
  seeds: [20260881]
  learning_rate: 0.001
  rescue_learning_rate: 0.0005
  max_steps: 200
  validation_interval: 20
  patience_intervals: 5
  fk_p95_max_mm: 15.0
  fk_p99_max_mm: 30.0
  fk_p999_max_mm: 40.0
  random_set_max_is_diagnostic_only: true

  target_unique_rows: 5000
  maximum_unique_rows: 10000
  row_padding: false
  all_supervised_rows_count_toward_budget: true
  macroblock_mm: 40
  macroblock_sizes_mm: [40, 30, 20]
  minimum_train_blocks: 10
  minimum_validation_blocks: 3
  minimum_test_blocks: 3
  minimum_rows_per_split: 500
  split_seed: 20260881
  split_fractions: [0.70, 0.15, 0.15]
  enrichment_seed: 20260884
  multiparent_count: 2
  multiparent_beta_gap_max_deg: 0.5
  continuation_residual_max_mm: 3.0
  wave_size: 2048
  logical_shard_count: 48
  maximum_attempt_rows: 20000


  maximum_concurrent_workers: 12
  assignment_strategy: cost_balanced_lpt
  progress_every_schedules: 32
  checkpoint_resume: true
  screening_first: true
  screening_fallback_to_full_audit: true

pilot:
  parent_cell_count: 1000
  task_probe_count: 5000
  root_count: 24
  root_expansion_budgets: [8, 16, 24]
  root_expansion_measure_gain_stop: 0.01
  hard_meso_parent_target: 192
  hard_meso_parent_min: 128
  hard_meso_parent_max: 256
  beam_width: 1
  maximum_growth_waves: 16
  minimum_chart_cells: 8
  minimum_chart_fraction: 0.002
  minimum_chart_spread_mm: 10.0
  minimum_stitch_overlap_cells: 8
  stitch_p95_max_deg: 0.5
  stitch_max_deg: 1.0
  minimum_boundary_transition_edges: 4
  minimum_overlap_fraction: 0.002
  minimum_overlap_spread_mm: 10.0
  abstention_hops: 0
  abstention_radius_mm: 10.0
  labelable_measure_min: 0.15
  labelable_measure_lcb_min: 0.10
  largest_coherent_region_min: 0.05
  unresolved_abstention_max: 0.90
  require_all_x_tertiles: false
  minimum_x_tertiles: 1
  bootstrap_replicates: 500
  bootstrap_seed: 20260883
  local_refinement:

robot:
  k: 3
  D: 10
  kD: 30

kinematics:
  theta_sign: -1.0

paths:
  lengths_csv: data/robot/generated/lengths.csv
  holes_csv: data/robot/generated/holes.csv
  disks_csv: data/robot/generated/disks.csv
  material_csv: data/robot/generated/material_rods_only.csv
  end_effector_csv: data/robot/generated/end_effector.csv

physics:
  g: 9.81

friction:
  mu_shaft: 0.15
  r_shaft_m: 0.004
  mu_cable: 0.10

tension:
  bounds_n: [0.0, 2000.0]

cables:
  end_disk_by_j:
    "1": 10
    "2": 10
    "3": 20
    "4": 20
    "5": 30
    "6": 30
    "7": 30
    "8": 30
    "9": 20
    "10": 20
    "11": 10
    "12": 10

sampling:
  beta_ranges_rad:
    beta1: [-0.3490658503988659, 0.3490658503988659]
    beta2: [-0.3490658503988659, 0.3490658503988659]
    beta3: [-0.3490658503988659, 0.3490658503988659]
    beta4: [-0.3490658503988659, 0.3490658503988659]
    beta5: [-0.3490658503988659, 0.3490658503988659]
    beta6: [-0.3490658503988659, 0.3490658503988659]
  xyz_ranges_m:
    x_m: [-0.30, 0.90]
    y_m: [-0.70, 0.70]
    z_m: [-0.70, 0.70]
  rng_seed: 20260208

pso:
  n_particles: 24
  iters: 40
  inertia: 0.72
  c1: 1.49
  c2: 1.49
  w_resid: 1000000.0
  lambda_max: 5000.0
  max_tension_power: 4.0
  w_tension_mean: 2000.0
  w_tension_soft_cap: 1200000.0
  tension_soft_cap_ratio: 0.90
  early_stop_mean_rnorm2: 1.0e-8
  rng_seed: 20260208

inverse_pso:
  n_particles: 8
  iters: 10
  inertia: 0.72
  c1: 1.49
  c2: 1.49
  w_xyz: 200000.0
  w_resid: 500000.0
  lambda_max: 5000.0
  w_beta_l2: 800.0
  w_tension_mean: 500.0
  w_tension_soft_cap: 200000.0
  tension_soft_cap_ratio: 0.92
  max_tension_power: 3.0
  early_stop_xyz_err_m: 0.02
  early_stop_mean_rnorm2: 1.0e-5

dataset:
  mode: inverse_joint
  rms_rnorm_threshold: 0.12
  xyz_err_threshold_m: 0.06
  shard_rows: 200
  out_dir: data/rods_only_20deg_inverse_smoke

parallel:
  workers: 4

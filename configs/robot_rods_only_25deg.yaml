robot:
  k: 3
  D: 10
  kD: 30

kinematics:
  theta_sign: -1.0

paths:
  lengths_csv: data/robot/generated/lengths.csv
  holes_csv: data/robot/generated/holes.csv
  disks_csv: data/robot/generated/disks.csv
  material_csv: data/robot/generated/material_rods_only.csv
  end_effector_csv: data/robot/generated/end_effector.csv

physics:
  g: 9.81

friction:
  mu_shaft: 0.15
  r_shaft_m: 0.004
  mu_cable: 0.10

tension:
  bounds_n: [0.0, 2000.0]

cables:
  end_disk_by_j:
    "1": 10
    "2": 10
    "3": 20
    "4": 20
    "5": 30
    "6": 30
    "7": 30
    "8": 30
    "9": 20
    "10": 20
    "11": 10
    "12": 10

sampling:
  # 每个 theta_i 由对应的 beta 决定（Eq.50：odd/even 交替），因此只要限制 beta 即可限制 |theta|。
  # 25deg = 0.4363323129985824 rad
  beta_ranges_rad:
    beta1: [-0.4363323129985824, 0.4363323129985824]
    beta2: [-0.4363323129985824, 0.4363323129985824]
    beta3: [-0.4363323129985824, 0.4363323129985824]
    beta4: [-0.4363323129985824, 0.4363323129985824]
    beta5: [-0.4363323129985824, 0.4363323129985824]
    beta6: [-0.4363323129985824, 0.4363323129985824]
  rng_seed: 20260206

pso:
  # 用于 2000 条数据的可行性生成（较快）；若你后续要生成 100k 或更严格阈值，再加大 iters/particles。
  n_particles: 24
  iters: 40
  inertia: 0.72
  c1: 1.49
  c2: 1.49
  w_resid: 1000000.0
  lambda_max: 1.0
  early_stop_mean_rnorm2: 1.0e-8
  rng_seed: 20260206

dataset:
  rms_rnorm_threshold: 6.0e-2
  shard_rows: 1000
  out_dir: data/rods_only_25deg_2k

parallel:
  workers: 4


robot:
  k: 3
  D: 10
  kD: 30

kinematics:
  theta_sign: -1.0

paths:
  lengths_csv: data/robot/generated/lengths.csv
  holes_csv: data/robot/generated/holes.csv
  disks_csv: data/robot/generated/disks.csv
  material_csv: data/robot/generated/material_rods_only.csv
  end_effector_csv: data/robot/generated/end_effector.csv

physics:
  g: 9.81

friction:
  mu_shaft: 0.15
  r_shaft_m: 0.004
  mu_cable: 0.10

tension:
  bounds_n: [0.0, 2000.0]

cables:
  end_disk_by_j:
    "1": 10
    "2": 10
    "3": 20
    "4": 20
    "5": 30
    "6": 30
    "7": 30
    "8": 30
    "9": 20
    "10": 20
    "11": 10
    "12": 10

sampling:
  rng_seed: 20260608
  beta_ranges_rad:
    beta1: [-0.08726646259971647, 0.08726646259971647]
    beta2: [-0.08726646259971647, 0.08726646259971647]
    beta3: [-0.08726646259971647, 0.08726646259971647]
    beta4: [-0.08726646259971647, 0.08726646259971647]
    beta5: [-0.17453292519943295, 0.17453292519943295]
    beta6: [-0.17453292519943295, 0.17453292519943295]

active_generation:
  target_pool_size: 50000
  target_oversample: 2
  target_components:
    sobol_full: 0.50
    distal_biased: 0.50
  distal_biased:
    proximal_abs_ratio_max: 0.45
    distal_abs_ratio_min: 0.55
  radius_bins: 5
  z_bins: 5
  angle_bins: 8
  min_candidates_per_target: 2
  warm_start_candidates: 3
  warm_start_perturb_sigma_rad: 0.01
  xyz_err_threshold_m: 0.006
  graph_k_neighbors: 16
  graph_radius_m: 0.02
  graph_max_icm_iters: 10
  lambda_theta: 2.0
  lambda_beta: 1.0
  lambda_tension: 0.2

tension_labeler:
  method: segmented_canonical

segmented_tension:
  max_nfev: 80
  t_ref_n: 800.0
  feasible_rms_rnorm: 6.0e-2

pso:
  objective: paper_constraint
  backend: numpy
  n_particles: 24
  iters: 40
  inertia: 0.72
  c1: 1.49
  c2: 1.49
  w_resid: 1000000.0
  lambda_max: 5000.0
  max_tension_power: 1.0
  w_tension_mean: 0.0
  w_tension_soft_cap: 0.0
  tension_soft_cap_ratio: 1.0
  paper_feasible_rms_rnorm: 6.0e-2
  early_stop_mean_rnorm2: 1.0e-8
  rng_seed: 20260608

inverse_pso:
  backend: numpy
  n_particles: 20
  iters: 28
  inertia: 0.72
  c1: 1.49
  c2: 1.49
  normalized_objectives: true
  w_xyz: 1.0
  xyz_cost_scale_m: 0.015
  xyz_cost_delta: 0.6
  w_beta_l2: 0.03
  w_continuity: 0.0
  cont_cost_scale_deg: 6.0
  cont_cost_delta: 0.4
  continuity_max_ratio: 0.30
  continuity_relax_if_err_ratio: 1.2
  continuity_relax_scale: 0.3
  warm_start: true
  warm_start_particles: 8
  warm_start_sigma: 0.08
  n_restarts: 1
  restart_seed_stride: 2003
  select_w_xyz: 1.0
  select_w_delta_theta: 0.0
  early_stop_xyz_err_m: 0.004
  early_stop_mean_rnorm2: 1.0e-8
  canonical_mode: none
  theta1_priority_enable: false

dataset:
  mode: active_xyz_single_branch
  rms_rnorm_threshold: 6.0e-2
  xyz_err_threshold_m: 0.006
  shard_rows: 2000
  out_dir: data/active_xyz_2k_single_branch_distal_v3

parallel:
  workers: 1

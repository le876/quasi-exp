robot:
  k: 3
  D: 10
  kD: 30

kinematics:
  theta_sign: -1.0

paths:
  lengths_csv: data/robot/generated/lengths.csv
  holes_csv: data/robot/generated/holes.csv
  disks_csv: data/robot/generated/disks.csv
  material_csv: data/robot/generated/material.csv
  end_effector_csv: data/robot/generated/end_effector.csv

physics:
  g: 9.81

friction:
  mu_shaft: 0.15
  r_shaft_m: 0.004
  mu_cable: 0.10

tension:
  bounds_n: [0.0, 2000.0]

cables:
  end_disk_by_j:
    "1": 10
    "2": 10
    "3": 20
    "4": 20
    "5": 30
    "6": 30
    "7": 30
    "8": 30
    "9": 20
    "10": 20
    "11": 10
    "12": 10

sampling:
  beta_ranges_rad:
    beta1: [-0.20, 0.20]
    beta2: [-0.05, 0.05]
    beta3: [-0.20, 0.20]
    beta4: [-0.05, 0.05]
    beta5: [-0.20, 0.20]
    beta6: [-0.05, 0.05]
  rng_seed: 123

pso:
  # smoke：先跑通管线，后续用 robot_generated.yaml 的更强配置生成最终数据集
  n_particles: 24
  iters: 40
  inertia: 0.72
  c1: 1.49
  c2: 1.49
  w_resid: 1000000.0
  lambda_max: 1.0
  early_stop_mean_rnorm2: 1.0e-8
  rng_seed: 20260205

dataset:
  # smoke：阈值放宽，只验证管线与约束；最终用更严格阈值
  rms_rnorm_threshold: 5.0e-2
  shard_rows: 100
  out_dir: data/smoke_out

parallel:
  workers: 1


[build-system]
requires = ["setuptools==69.5.1", "wheel==0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quasi-exp"
version = "0.1.0"
description = "Dataset reproduction for quasi-static dynamics-based continuum robot control"
requires-python = "==3.11.*"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.11.4",
  "pandas==2.2.2",
  "pyarrow==16.1.0",
  "PyYAML==6.0.1",
  "tqdm==4.66.4",
]

[project.optional-dependencies]
dev = [
  "pytest==8.2.2",
]
ml = [
  "scikit-learn==1.3.0",
  "joblib==1.2.0",
  "matplotlib==3.10.0",
]
teacher-gpu = [
  "tensorflow==2.21.0",
  "nvidia-cublas-cu12==12.5.3.2",
  "nvidia-cuda-runtime-cu12==12.5.82",
  "nvidia-cudnn-cu12==9.3.0.75",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
